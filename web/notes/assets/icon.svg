<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="28%" cy="20%" r="95%">
      <stop offset="0" stop-color="#9C1757"/>
      <stop offset=".38" stop-color="#3A1258"/>
      <stop offset=".75" stop-color="#120A24"/>
      <stop offset="1" stop-color="#06040D"/>
    </radialGradient>
    <radialGradient id="nebula" cx="82%" cy="88%" r="55%">
      <stop offset="0" stop-color="#7A1F86" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7A1F86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE6F3"/>
      <stop offset=".45" stop-color="#FF5FA8"/>
      <stop offset="1" stop-color="#C7A4FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="twinkle" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#nebula)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="74" cy="96" r="2.2" opacity=".8"/><circle cx="118" cy="168" r="1.3" opacity=".5"/><circle cx="432" cy="72" r="1.8" opacity=".7"/>
    <circle cx="462" cy="210" r="1.2" opacity=".5"/><circle cx="452" cy="318" r="2" opacity=".6"/><circle cx="88" cy="420" r="1.6" opacity=".6"/>
    <circle cx="300" cy="468" r="1.4" opacity=".5"/><circle cx="210" cy="52" r="1.2" opacity=".55"/><circle cx="388" cy="438" r="1.1" opacity=".45"/>
    <circle cx="44" cy="300" r="1.2" opacity=".5"/>
  </g>
  <!-- orbit behind the letter -->
  <ellipse cx="256" cy="258" rx="196" ry="66" fill="none" stroke="#FFD1EA" stroke-opacity=".38" stroke-width="3" stroke-dasharray="3 11" stroke-linecap="round" transform="rotate(-22 256 258)"/>
  <!-- the N: glow, then the letter -->
  <path d="M150 380V132h58l98 146V132h58v248h-58l-98-146v146z" fill="#FF5FA8" opacity=".75" filter="url(#glow)"/>
  <path d="M150 380V132h58l98 146V132h58v248h-58l-98-146v146z" fill="url(#letter)"/>
  <path d="M150 380V132h58l98 146V132h58v248h-58l-98-146v146z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  <!-- orbit in front of the letter (lower arc) and its star -->
  <path d="M71 318 A196 66 -22 0 0 441 198" fill="none" stroke="#FFD1EA" stroke-opacity=".8" stroke-width="3.2" stroke-dasharray="3 11" stroke-linecap="round" transform="rotate(0)"/>
  <g transform="translate(410 214)">
    <circle r="16" fill="#FF5FA8" opacity=".9" filter="url(#twinkle)"/>
    <path d="M0-20 3.4-3.4 20 0 3.4 3.4 0 20-3.4 3.4-20 0-3.4-3.4z" fill="#fff"/>
  </g>
  <g transform="translate(118 132) scale(.55)"><path d="M0-20 3.4-3.4 20 0 3.4 3.4 0 20-3.4 3.4-20 0-3.4-3.4z" fill="#FFD1EA" opacity=".9"/></g>
</svg>
