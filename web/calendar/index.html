<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar</title>
<meta name="description" content="Calendar: the studio's note cards and day cards, with Quests, bookings and the real sky, inside Nova Agent.">
<meta name="theme-color" content="#06040D">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="js/embed.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Saira:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/shared/themes.css">
<script src="/shared/spectrum.js"></script>
<script src="/shared/themes.js"></script>
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/cosmos.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="simple.css"><!-- Simple design (the default; Rich is the look before) -->
<!-- Every button's look, last so it decides it (buttons.css) -->
<link rel="stylesheet" href="/shared/buttons.css">
<link rel="stylesheet" href="/shared/scrollbars.css"><!-- Scrollbars: easy to grab, in the theme's colours -->
<link rel="stylesheet" href="/shared/fit.css"><script src="/shared/fit.js" defer></script><!-- Fit on screen: nothing floats past the edge -->
<script src="/shared/look.js"></script>
<link rel="stylesheet" href="/shared/simple.css"><link rel="stylesheet" href="/shared/onescreen.css"><!-- (here from the start, not added later by fit.js: nothing moves when they arrive) -->
</head>
<body>
<div class="cal" id="cal">
  <header class="bar">
    <div class="nav">
      <button class="icon-btn" id="prev" type="button" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="title" id="title" type="button" aria-label="Jump to a date" title="Jump to a date"><span id="title-text">Calendar</span><svg viewBox="0 0 24 24" class="caret" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="icon-btn" id="next" type="button" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="chip today" id="today" type="button" title="Go to today">Today</button>
      <input type="date" id="jump" class="jump" aria-label="Jump to a date" tabindex="-1">
    </div>
    <div class="tools">
      <div class="views" role="tablist" aria-label="View">
        <button type="button" role="tab" data-view="month">Month</button>
        <button type="button" role="tab" data-view="week">Week</button>
        <button type="button" role="tab" data-view="day">Day</button>
        <button type="button" role="tab" data-view="list">List</button>
      </div>
      <button class="icon-btn" id="search-btn" type="button" aria-label="Search" title="Search note cards and day cards"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
      <button class="icon-btn" id="layers-btn" type="button" aria-label="What to show, and backups" title="What to show, and backups" aria-haspopup="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.8 2.2a2 2 0 0 0-1.6 0L2.6 6.1a1 1 0 0 0 0 1.8l8.6 3.9a2 2 0 0 0 1.6 0l8.6-3.9a1 1 0 0 0 0-1.8z"/><path d="m2 12 9.2 4.2a2 2 0 0 0 1.6 0L22 12"/><path d="m2 17 9.2 4.2a2 2 0 0 0 1.6 0L22 17"/></svg></button>
      <button class="add-btn" id="add" type="button" aria-label="New note card" title="New note card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Note card</span></button>
    </div>
  </header>

  <div class="status" id="status" hidden></div>
  <div class="search" id="search" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input type="search" id="search-input" placeholder="Search note cards and day cards" autocomplete="off" aria-label="Search note cards and day cards">
    <button class="icon-btn" id="search-close" type="button" aria-label="Close search" title="Close search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>

  <main class="view" id="view" tabindex="-1"></main>
</div>

<!-- What to show -->
<div class="pop" id="layers" hidden role="dialog" aria-label="What to show, and backups">
  <p class="pop-h">Show</p>
  <label><input type="checkbox" data-layer="events" checked><span class="sw ev"></span>Note cards</label>
  <label><input type="checkbox" data-layer="days" checked><span class="sw day"></span>Day cards</label>
  <label><input type="checkbox" data-layer="sky" checked><span class="sw sky"></span>Moon and special days</label>
  <label><input type="checkbox" data-layer="quests" checked><span class="sw quest"></span>Quests (Nova Agent's plan)</label>
  <label><input type="checkbox" data-layer="bookings" checked><span class="sw book"></span>Studio bookings</label>
  <p class="pop-h">Backup</p>
  <button type="button" class="pop-btn" id="export" title="Download a backup of your note cards and day cards"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Export: download a backup</button>
  <label class="pop-btn" for="import-file" title="Bring back a backup you downloaded"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Import a backup…</label>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</div>

<!-- Add or change a note card or a day card. (25 Oct 2026, the owner: "can you rework the note card creation gui it's
     very clunky and not very simple to do".) One box that understands typing ("Mix review Friday 2pm 1h") and fills
     the rest as you type, quick picks for the day, time and length, and the rest under More. -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <form id="form" novalidate>
    <div class="sheet-head">
      <button class="icon-btn" type="button" id="sheet-close" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h2 id="sheet-title">New note card</h2>
      <!-- (a new card: Note card or Day card, here in the title's place) -->
      <div class="kinds" id="kinds" role="tablist" aria-label="What to make">
        <button type="button" data-kind="event" class="on">Note card</button>
        <button type="button" data-kind="day">Day card</button>
      </div>
      <!-- (More on a page of its own, when the window has no room for it beside or below: the way back) -->
      <button type="button" class="back-btn" id="more-back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back<span class="back-more">to what and when</span></button>
      <span class="more-pages" id="more-pages" hidden><button type="button" class="icon-btn" id="more-prev" aria-label="Back a page" title="Back a page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><b id="more-page"></b><button type="button" class="icon-btn" id="more-next" aria-label="Next page" title="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></span>
      <button class="save" type="submit" id="save" title="Save (Enter)">Save</button>
    </div>
    <!-- (laid out and, when even that can't fit, paged by cal.js itself: onescreen.js shrank and cut its columns) -->
    <div class="sheet-body" data-os-skip>
      <!-- What and when: the essentials -->
      <div class="pane pane-main" id="pane-main">
        <div class="col-what">
          <div class="smart">
            <span class="smart-ico" id="f-ico"></span>
            <input class="big" id="f-title" type="text" placeholder="What and when? Mix review Friday 2pm 1h" maxlength="200" autocomplete="off" enterkeyhint="done" aria-label="What and when" aria-describedby="quick-hint">
          </div>
          <p class="readback" id="quick-hint" aria-live="polite"></p>
          <p class="readonly" id="readonly" hidden></p>
        </div>
        <div class="col-when">
          <div class="row qrow"><span>Day</span><div class="chips qchips" id="q-day" role="group" aria-label="Day"></div></div>
          <div class="group" data-for="event">
            <div class="row qrow"><span>Time</span><div class="chips qchips" id="q-time" role="group" aria-label="Time"></div></div>
            <div class="row qrow"><span>How long</span><div class="chips qchips" id="q-len" role="group" aria-label="How long"></div></div>
            <!-- (exactly: any date and time, for what the quick picks don't cover) -->
            <div class="row exact" id="exact">
              <span>From</span><input type="date" id="f-sdate" aria-label="Start date" title="Start date"><input type="time" id="f-stime" step="300" aria-label="Start time" title="Start time">
              <span class="to">to</span><input type="date" id="f-edate" aria-label="End date" title="End date"><input type="time" id="f-etime" step="300" aria-label="End time" title="End time">
              <input type="checkbox" id="f-allday" hidden aria-label="All day">
            </div>
          </div>
          <div class="group" data-for="day" hidden>
            <div class="row"><span>Date</span><input type="date" id="d-date" aria-label="Date"><label class="toggle yearly"><span>Every year</span><input type="checkbox" id="d-yearly"><span class="switch"></span></label></div>
            <div class="row"><span>Kind</span><select id="d-preset" aria-label="Kind of day"></select></div>
          </div>
        </div>
        <div class="foot">
          <!-- (its words after More are what's set inside it, the card's own content: they wrap rather than hide) -->
          <button type="button" class="more-btn" id="more-btn" aria-expanded="false" aria-controls="pane-more" data-content-card><b id="more-word">More</b><small id="more-sum"></small><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          <div class="actions" id="actions">
            <button type="button" class="ghost" id="duplicate">Duplicate</button>
            <button type="button" class="danger" id="delete">Delete</button>
          </div>
        </div>
      </div>

      <!-- More: repeat, reminders, phones, colour, place, Meet, notes and the artwork (beside, below, or a page of its own when there's no room) -->
      <div class="pane pane-more" id="pane-more" hidden>
        <!-- Its artwork: a note card's picture, a day card's header (painted by cosmos.js) -->
        <div class="art-head" id="art-head">
          <b class="dc-title" id="art-title"></b>
          <div class="art-tools">
            <select id="note-subject" aria-label="Artwork"></select>
            <button type="button" id="art-new" title="Paint a new artwork for this card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.6 3.6-1.2-1.2a1.2 1.2 0 0 0-1.7 0L2.4 18.6a1.2 1.2 0 0 0 0 1.7l1.3 1.3a1.2 1.2 0 0 0 1.7 0L21.6 5.4a1.2 1.2 0 0 0 0-1.8M14 7l3 3M5 6v4M19 14v4M10 2v2M7 8H3M21 16h-4M11 3H9"/></svg>New artwork</button>
            <a id="art-save" href="#" download="card.png" title="Save this artwork as a picture"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>Save image</a>
          </div>
        </div>
        <div class="group" data-for="event">
          <div class="row"><span>Repeats</span>
            <select id="f-repeat" aria-label="Repeats">
              <option value="">Doesn't repeat</option>
              <option value="daily">Every day</option>
              <option value="weekly">Every week</option>
              <option value="monthly">Every month</option>
              <option value="yearly">Every year</option>
              <option value="custom">Custom…</option>
            </select>
          </div>
          <div class="custom" id="custom" hidden>
            <div class="row"><span>Every</span><input type="number" id="f-interval" min="1" max="99" value="1" aria-label="Every how many"><select id="f-freq" aria-label="Unit"><option value="daily">days</option><option value="weekly">weeks</option><option value="monthly">months</option><option value="yearly">years</option></select></div>
            <div class="wd" id="f-days" aria-label="On these days"></div>
            <div class="row"><span>Ends</span>
              <select id="f-ends" aria-label="Ends"><option value="never">Never</option><option value="until">On a date</option><option value="count">After a number of times</option></select>
              <input type="date" id="f-until" aria-label="Last date" hidden><input type="number" id="f-count" min="1" max="1000" value="10" aria-label="How many times" hidden>
            </div>
          </div>
          <div class="row"><span>Remind me</span><div class="chips" id="f-reminders"></div></div>
          <div class="row" id="f-phones-row" hidden><span>Send to</span><div class="chips" id="f-phones"></div></div>
          <div class="row"><span>Colour</span><div class="colors" id="f-colors"></div></div>
          <!-- Where, and a Google Meet link (made by Google when the calendar syncs, if Google is connected) -->
          <div class="row where-row">
            <input id="f-location" type="text" placeholder="Where" maxlength="160" aria-label="Where">
            <label class="meet-tick"><input type="checkbox" id="f-meet"> Google Meet link</label><a id="f-meet-link" class="meet-link" href="#" target="_blank" rel="noopener" hidden>Join the call ↗</a>
          </div>
        </div>
        <div class="group" data-for="day" hidden>
          <div class="row stack"><span>Title style</span><div class="aes-grid" id="aes-grid"></div></div>
          <div class="row stack"><span>Theme</span><div class="theme-grid" id="theme-grid"></div></div>
          <input id="d-location" type="text" placeholder="Where" maxlength="120" aria-label="Where">
        </div>
        <textarea id="f-notes" rows="2" placeholder="Notes" maxlength="5000" aria-label="Notes"></textarea>
      </div>
    </div>
  </form>
</section>

<!-- This one, this and following, or all? -->
<section class="sheet small" id="which" hidden role="dialog" aria-modal="true" aria-labelledby="which-title">
  <div class="sheet-head"><h2 id="which-title">Change which?</h2></div>
  <div class="sheet-body which">
    <button type="button" data-which="one">Just this one</button>
    <button type="button" data-which="following">This and the ones after</button>
    <button type="button" data-which="all">Every one</button>
    <button type="button" class="ghost" data-which="">Cancel</button>
  </div>
</section>

<div class="toast" id="toast" hidden role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo" hidden>Undo</button></div>

<script src="/shared/sfx.js"></script>
<script src="js/themes.js"></script>
<script src="js/presets.js"></script>
<script type="module" src="js/cal.js"></script>
<script src="js/menu.js" defer></script><!-- The right-click menu: note cards and day cards -->
<script src="/shared/badge.js" defer></script>
</body>
</html>
