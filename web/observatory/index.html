<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Observatory</title>
<meta name="description" content="Nova Observatory: every project in one sky. Where each one lives, what it's for, how big it is, and what it looks like.">
<meta name="theme-color" content="#05030F">
<link rel="icon" href="assets/sigil.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Saira:wght@300..700&family=Source+Code+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/observatory.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <header class="hero">
    <div class="hero-top">
      <a class="brand" href="./" aria-label="Nova Observatory home">
        <svg class="sigil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
          <path d="M20.19 6.26A10 10 0 0 1 6.26 20.19" stroke-width=".55" stroke-dasharray=".35 1.1"/>
          <path d="M3.81 17.74A10 10 0 0 1 17.74 3.81" stroke-width=".55" stroke-dasharray=".35 1.1"/>
          <path d="M3.9 20.1 11.3 7.5M12.5 8.3 13.5 16M14.7 16.5 20.1 3.9" stroke-width=".5" opacity=".75"/>
          <g fill="#fff" stroke="none">
            <circle cx="3.9" cy="20.1" r=".75"/><circle cx="11.3" cy="7.5" r=".65"/><circle cx="12.5" cy="8.3" r=".5"/>
            <circle cx="13.5" cy="16" r=".65"/><circle cx="14.7" cy="16.5" r=".5"/><circle cx="20.1" cy="3.9" r=".85"/>
          </g>
        </svg>
        <span class="brand-text">
          <span class="kicker">Nova suite · Novacane</span>
          <span class="wordmark">Nova Observatory</span>
        </span>
      </a>
      <div class="themes" id="themes" role="radiogroup" aria-label="Colour theme"></div>
      <div class="hero-links">
        <!-- Nova Portal: who you are (connect it once in Nova Portal; inside Nova Agent, who Nova Agent works for) -->
        <nova-manual compact></nova-manual>
        <nova-portal-badge></nova-portal-badge>
        <!-- Every Nova suite address, live and testing (behind the admin password) -->
        <a href="https://novacane-worker.novacane-studio.workers.dev/admin/links" target="_blank" rel="noopener" title="Every Nova suite address, live and testing (password protected)" style="margin-left:12px;padding:6px 12px;border:1px solid currentColor;border-radius:999px;font-size:12px;letter-spacing:.08em;text-decoration:none;color:inherit;opacity:.85">🔒 All links</a>
        <!-- Sound effects on or off (the shared Nova suite sounds, js/sfx.js); it plays its own chime when switched -->
        <button type="button" class="sound-toggle" id="sound" aria-pressed="true" data-sfx="none" title="Sound effects">Sound</button>
      </div>
    </div>
    <p class="hero-lede" id="lede">Every project in one sky.</p>
    <div class="stats" id="stats"></div>
    <div class="spectrum" id="spectrum" aria-label="Lines of code by language"></div>
  </header>

  <section class="controls" aria-label="Find a project">
    <label class="search">
      <span class="sr-only">Search projects</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Search name, goal, stack, path…" autocomplete="off">
    </label>
    <div class="filters" id="filters" role="group" aria-label="Category"></div>
    <label class="sort"><span>Sort</span>
      <select id="sort">
        <option value="recent">Recent activity</option>
        <option value="lines">Lines of code</option>
        <option value="disk">Size on disk</option>
        <option value="name">Name</option>
      </select>
    </label>
  </section>

  <main>
    <div class="decks" id="decks"></div>
    <p class="none" id="none" hidden>No project matches that search.</p>

    <section class="starmap-wrap" aria-labelledby="starmap-title">
      <div class="sec-title">
        <h2 id="starmap-title">Star map</h2>
        <p>Where everything lives. Each star is a project, placed on the folder tree it grows from; its size follows its lines of code.</p>
      </div>
      <div class="starmap" id="starmap"></div>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<dialog id="detail" class="detail" aria-labelledby="dt-name">
  <div class="dt-inner" id="dt-inner"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/sfx.js"></script>
<script src="data/projects.js"></script>
<script src="js/themes.js"></script>
<script src="js/cosmos.js"></script>
<script src="js/backdrop.js"></script>
<script src="js/observatory.js"></script>
<script src="js/portal-badge.js" defer></script>
<script src="js/nova-manual.js" defer></script>
</body>
</html>
