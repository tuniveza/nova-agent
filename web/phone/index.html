<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Phone</title>
<meta name="theme-color" content="#06040D">
<link rel="icon" href="/agent/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/agent/apple-touch-icon.png">
<link rel="manifest" href="/phone/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova Phone">
<!-- Nova Phone, the mobile version (23 Oct 2026, the user: a separate web app for each platform, every place
     made for the phone; Nova Desk, the computer version, is /agent/). The same server, sign-in, data and themes. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@110..125,700..900&family=Saira:wght@400..700&family=Source+Code+Pro:wght@400;600&display=optional">
<link rel="stylesheet" href="/shared/themes.css">
<link rel="stylesheet" href="/phone/phone.css">
<link rel="stylesheet" href="/phone/nova-look.css">
<script src="/shared/themes.js"></script>
<!-- the theme for Nova Phone and Nova Desk (nova-look), worked out last time, on before the first frame -->
<script src="/phone/look.js"></script>
<script src="/phone/tiles.js" defer></script>
<script src="/phone/phone.js" defer></script>
<!-- Today, the first screen, and what it shows (fetched alongside the rest, not after it); every other place's
     code (money.js and the rest) phone.js loads when it's opened, or quietly once this screen is up -->
<script src="/phone/inbox.js" defer></script>
<script src="/phone/today.js" defer></script>
<script src="/phone/calendar.js" type="module"></script>
<script src="/phone/quests.js" type="module"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-side" id="top-left"></div>
    <h1 class="top-title" id="title">Nova Phone</h1>
    <div class="top-side" id="top-right"></div>
  </header>
  <main class="page" id="page" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>
<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
