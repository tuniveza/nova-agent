<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The Crew mark: a cosmic P, in the Nova Agent family (same sky, stars, orbit and sparkle as
       Studio's mark and Nova Index's I). The planet riding the orbit has a ring of its own: everyone who
       signs in here gets a world like it. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="15%" r="95%"><stop offset="0" stop-color="#B01D68"/><stop offset=".42" stop-color="#25194D"/><stop offset="1" stop-color="#06040D"/></radialGradient>
    <radialGradient id="neb" cx="88%" cy="92%" r="55%"><stop offset="0" stop-color="#7A1F86" stop-opacity=".75"/><stop offset="1" stop-color="#7A1F86" stop-opacity="0"/></radialGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD1EA"/><stop offset=".5" stop-color="#FF5FA8"/><stop offset="1" stop-color="#C7A4FF"/></linearGradient>
    <radialGradient id="world" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFD1EA"/><stop offset="1" stop-color="#C7A4FF"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="twinkle" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#neb)"/>
  <!-- stars -->
  <g fill="#fff"><circle cx="70" cy="90" r="2.6" opacity=".8"/><circle cx="440" cy="70" r="2" opacity=".6"/><circle cx="462" cy="330" r="2.4" opacity=".6"/><circle cx="80" cy="420" r="1.8" opacity=".55"/><circle cx="290" cy="470" r="1.6" opacity=".5"/><circle cx="150" cy="200" r="1.4" opacity=".45"/><circle cx="392" cy="150" r="1.6" opacity=".5"/><circle cx="44" cy="290" r="1.2" opacity=".5"/></g>
  <!-- the back half of the orbit, faint, behind the letter -->
  <ellipse cx="256" cy="262" rx="196" ry="50" fill="none" stroke="#FFD1EA" stroke-opacity=".35" stroke-width="3.5" stroke-dasharray="3 11" stroke-linecap="round" transform="rotate(-14 256 262)"/>
  <!-- the P: a soft glow, then the letter -->
  <path d="M156 380V132h112c56 0 92 34 92 84s-36 84-92 84h-52v80zm60-136h48c22 0 36-11 36-28s-14-28-36-28h-48z" fill-rule="evenodd" fill="#FF5FA8" opacity=".75" filter="url(#glow)"/>
  <path d="M156 380V132h112c56 0 92 34 92 84s-36 84-92 84h-52v80zm60-136h48c22 0 36-11 36-28s-14-28-36-28h-48z" fill-rule="evenodd" fill="url(#letter)"/>
  <path d="M156 380V132h112c56 0 92 34 92 84s-36 84-92 84h-52v80zm60-136h48c22 0 36-11 36-28s-14-28-36-28h-48z" fill-rule="evenodd" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  <!-- the front half of the orbit, passing over the letter -->
  <path d="M65.8 309.4A196 50-14 0 0 446.2 214.6" fill="none" stroke="#FFD1EA" stroke-opacity=".85" stroke-width="4" stroke-dasharray="3 11" stroke-linecap="round"/>
  <!-- the sparkle, up by the P's shoulder -->
  <g transform="translate(118 112)"><circle r="14" fill="#FF5FA8" opacity=".85" filter="url(#twinkle)"/><path d="M0-24 4-4 24 0 4 4 0 24-4 4-24 0-4-4z" fill="#fff"/></g>
  <!-- the ringed planet riding the orbit -->
  <g transform="translate(418 254)">
    <circle r="26" fill="#FF5FA8" opacity=".6" filter="url(#twinkle)"/>
    <ellipse rx="27" ry="7" fill="none" stroke="#FFD1EA" stroke-opacity=".55" stroke-width="3" transform="rotate(-20)"/>
    <circle r="14" fill="url(#world)"/>
    <path d="M-25.4 9.2A27 7-20 0 0 25.4-9.2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" transform="rotate(0)"/>
  </g>
</svg>
