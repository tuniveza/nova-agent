<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="/shared/inside.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixer</title>
  <link rel="icon" href="data:,">
  <!-- Nova Agent's fonts, colours (themes.css; look.js swaps them for the chosen theme) and the tools' look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@110..125,700..900&family=Saira:wght@400..700&family=Source+Code+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="/shared/themes.css">
  <link rel="stylesheet" href="/shared/tools.css">
  <link rel="stylesheet" href="fixer.css">
  <!-- Every button's look (buttons.css; body.nb-plain: plain buttons join in) -->
  <link rel="stylesheet" href="/shared/buttons.css">
  <link rel="stylesheet" href="/shared/scrollbars.css"><!-- Scrollbars: easy to grab, in the theme's colours -->
  <link rel="stylesheet" href="/shared/fit.css"><script src="/shared/fit.js" defer></script><!-- Fit on screen: nothing floats past the edge -->
  <script src="/shared/spectrum.js"></script>
  <script src="/shared/themes.js"></script>
  <script src="/shared/look.js"></script>
</head>
<body class="nb-plain nb-tool">
<!-- The Fixer, from the ground up (16 Oct 2026): three strict rules, never compromised, checked on
     all of Nova Agent every 30 minutes (src/fixer/strict.ts). One screen: only the list scrolls. -->
<main>
  <header class="top">
    <h1 class="nt-title">Fixer</h1>
    <p class="nt-sub" id="sub">Checks all of Nova Agent every 30 minutes against three rules.</p>
  </header>

  <section class="rules" id="rules" aria-label="The three rules"></section>

  <div class="bar">
    <p class="when" id="when">–</p>
    <button type="button" id="auto" aria-pressed="true">Auto-fix: On</button>
    <button type="button" id="check" class="primary">Check now</button>
  </div>

  <div class="filters" role="group" aria-label="Show">
    <div class="seg" id="f-kind">
      <button type="button" data-kind="all" aria-pressed="true">All</button>
      <button type="button" data-kind="phone" aria-pressed="false">Phones</button>
      <button type="button" data-kind="tablet" aria-pressed="false">Tablets</button>
      <button type="button" data-kind="computer" aria-pressed="false">Computers</button>
    </div>
  </div>

  <section class="list" id="list" aria-live="polite"></section>
</main>

<dialog class="shot" id="shot">
  <div class="shot-head"><p id="shot-title"></p><button type="button" id="shot-close" aria-label="Close">✕</button></div>
  <div class="shot-body"><img id="shot-img" alt=""></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
