  <title>Fixer</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@110..125,700..900&family=Saira:wght@400..700&family=Source+Code+Pro:wght@400;600&display=swap">

  <link rel="stylesheet" href="/shared/buttons.css">

<body class="nb-plain nb-tool">
<!-- Fixer off (24 Oct 2026, the user: "you can turn the fixer off it's irrelevant at the moment and not very usable
     … in fact just disable it entirely in all aspects for now it's a waste of time"). The Fixer's own page is kept
     as on.html; this one says it's off, so an old link or bookmark isn't a dead end. Home goes back to Nova Desk
     (Nova Phone on a phone). Auto-fix (/shared/rules.js) isn't the Fixer's checks and still runs: its switch
     for this device stays here, as it was on the Fixer's page. -->
<main class="off">
  <section class="nt-card off-card" aria-labelledby="off-title">
    <span class="nt-kicker">Backend</span>
    <h1 class="nt-title" id="off-title">Fixer</h1>
    <p class="off-say"><b>The Fixer is switched off for now.</b></p>
    <p class="nt-sub">It doesn't check any screens, take pictures or sign in while it's off.</p>
    <div class="off-do">
      <a class="btn primary" id="home" href="/agent/" target="_top">Home</a>
    </div>
    <p class="off-auto"><span>Every screen still tidies its own layout as it draws (Auto-fix), on this device:</span>
      <button type="button" id="auto" aria-pressed="true">Auto-fix: On</button></p>
  </section>
</main>
<script src="off.js"></script>
</body>
</html>
