<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Planets</title>
<style>
  /* A local demo page for the planet generator. Serve this folder and open it. */
  :root { --bg: #06040D; --panel: #120C26; --ink: #F3EEFF; --muted: #A99BC9; --line: #2A1F52; --magenta: #FF5FA8; --gold: #F2D9A0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 700px at 70% -10%, #25194D 0%, var(--bg) 60%) fixed, var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 0.02em; }
  h1 span { background: linear-gradient(90deg, var(--magenta), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { margin: 40px 0 14px; font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
  p.lead { margin: 0; color: var(--muted); }
  .hero { display: grid; grid-template-columns: minmax(0, 512px) 1fr; gap: 28px; align-items: center; margin-top: 24px; }
  .hero .frame { border-radius: 28px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 30px 80px -30px #B01D6855; aspect-ratio: 1; }
  .hero .frame svg { display: block; width: 100%; height: auto; }
  .hero h3 { margin: 0 0 6px; font-size: 30px; }
  .hero .desc { color: var(--muted); font-size: 16px; }
  .hero code { color: var(--gold); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .card { background: #120C2699; border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px 12px; text-align: center; }
  .card svg { display: block; margin: 0 auto 6px; }
  .card b { display: block; font-size: 13px; }
  .card small { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; min-height: 2.6em; }
  .badges { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .chip img { width: 32px; height: 32px; }
  .chip span { font-size: 13px; }
  .sizes { display: flex; gap: 18px; align-items: end; }
  .sizes figure { margin: 0; text-align: center; color: var(--muted); font-size: 11px; }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1><span>Nova</span> planets</h1>
  <p class="lead">Every Nova suite member gets a planet drawn from their id. Same seed, same planet, everywhere.</p>

  <section class="hero">
    <div class="frame" id="hero"></div>
    <div>
      <h3 id="hero-name"></h3>
      <div class="desc" id="hero-desc"></div>
      <p class="desc">Hero view: 512px, animated, with a starfield. Seed <code id="hero-seed"></code>.</p>
      <div class="sizes" id="sizes"></div>
    </div>
  </section>

  <h2>Badges at 32px</h2>
  <div class="badges" id="badges"></div>

  <h2>staff-1 to staff-48 at 96px</h2>
  <div class="grid" id="grid"></div>
</main>

<script type="module">
  import { generatePlanet, renderPlanetSVG, planetToDataURI, novaTheme } from "./index.js";

  const theme = novaTheme;
  const heroSeed = new URLSearchParams(location.search).get("hero") || "staff-7";

  // The hero: big, animated, with stars behind
  const hero = generatePlanet(heroSeed, theme);
  document.getElementById("hero").innerHTML = renderPlanetSVG(hero, { size: 512, animate: true, background: true });
  document.getElementById("hero-name").textContent = hero.name;
  document.getElementById("hero-desc").textContent = hero.description;
  document.getElementById("hero-seed").textContent = heroSeed;
  // The same planet at every badge size
  document.getElementById("sizes").innerHTML = [24, 32, 48, 64, 96].map((s) => `<figure>${renderPlanetSVG(hero, { size: s })}<figcaption>${s}px</figcaption></figure>`).join("");

  // 32px badges, as <img> data URIs like a profile chip would use
  const badges = [];
  for (let i = 1; i <= 24; i++) {
    const p = generatePlanet(`staff-${i}`, theme);
    badges.push(`<span class="chip"><img alt="${p.description}" src="${planetToDataURI(renderPlanetSVG(p, { size: 32 }))}"><span>${p.name}</span></span>`);
  }
  document.getElementById("badges").innerHTML = badges.join("");

  // The gallery
  const cards = [];
  for (let i = 1; i <= 48; i++) {
    const p = generatePlanet(`staff-${i}`, theme);
    cards.push(`<div class="card" title="staff-${i}">${renderPlanetSVG(p, { size: 96 })}<b>${p.name}</b><small>${p.description}</small></div>`);
  }
  document.getElementById("grid").innerHTML = cards.join("");
  document.body.dataset.ready = "1";
</script>
</body>
</html>
